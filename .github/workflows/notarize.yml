name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build release binary
        run: swift build --configuration release

      - name: Create app bundle
        run: |
          mkdir -p CacheCleaner.app/Contents/MacOS
          mkdir -p CacheCleaner.app/Contents/Resources
          cp .build/release/CacheCleaner CacheCleaner.app/Contents/MacOS/
          cp Sources/CacheCleanerApp/Info.plist CacheCleaner.app/Contents/

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Cache Cleaner" \
            -srcfolder CacheCleaner.app \
            -ov -format UDZO \
            CacheCleaner-${{ github.ref_name }}.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cache Cleaner ${{ github.ref_name }}
          files: CacheCleaner-${{ github.ref_name }}.dmg
          generate_release_notes: true

# To enable notarization when you have an Apple Developer account:
# 1. Add secrets: APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD,
#    APPLE_TEAM_NAME, APPLE_TEAM_ID, APPLE_ID, APPLE_APP_PASSWORD
# 2. See docs/notarization.md for step-by-step setup
